<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário de Reavaliações — Análise de Crédito | Cristal Sete</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .page-header { background: linear-gradient(135deg, #1e3a5f 0%, #2B5FA6 100%); }
        .header-logo { height: 36px; width: auto; filter: brightness(0) invert(1); }
        .btn-sair { display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.75);font-size:0.8rem;font-weight:500;padding:0.4rem 0.875rem;border-radius:0.5rem;cursor:pointer;transition:all 0.2s; }
        .btn-sair:hover { background:rgba(255,255,255,0.15);color:white; }
        .avatar { width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:0.75rem; }

        /* Calendário */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .cal-day-name { text-align:center;font-size:0.7rem;font-weight:700;color:#9ca3af;padding:0.5rem 0;text-transform:uppercase; }
        .cal-day {
            min-height: 80px;
            border-radius: 0.5rem;
            padding: 0.375rem;
            background: white;
            border: 1px solid #f3f4f6;
            position: relative;
            cursor: default;
        }
        .cal-day.outro-mes { background: #fafafa; }
        .cal-day.hoje { border-color: #2B5FA6; background: #eff6ff; }
        .cal-day.tem-evento { cursor: pointer; }
        .cal-day.tem-evento:hover { border-color: #93c5fd; box-shadow: 0 2px 8px rgba(43,95,166,0.1); }
        .cal-day-num {
            font-size: 0.75rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 2px;
        }
        .cal-day.outro-mes .cal-day-num { color: #d1d5db; }
        .cal-day.hoje .cal-day-num {
            background: #2B5FA6;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
        }
        .cal-evento {
            font-size: 0.6rem;
            font-weight: 600;
            padding: 1px 4px;
            border-radius: 3px;
            margin-bottom: 1px;
            truncate;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            cursor: pointer;
        }
        .ev-vencido  { background: #fee2e2; color: #991b1b; }
        .ev-proximo  { background: #fef3c7; color: #92400e; }
        .ev-ok       { background: #d1fae5; color: #065f46; }
        .ev-mais { font-size:0.6rem; color:#6b7280; padding: 1px 2px; }
    </style>
</head>
<body class="bg-gray-50">
<script>
    if (sessionStorage.getItem('ac_logado') !== 'true') window.location.href = 'login.html';
    const acUser = JSON.parse(sessionStorage.getItem('ac_usuario') || '{}');
</script>

<header class="page-header sticky top-0 z-50">
    <nav class="container mx-auto px-4 py-3">
        <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 shrink-0">
                <button onclick="toggleSidebar()" class="sidebar-toggle-btn">
                    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <img src="assets/logos/cistalsete.png" alt="Cristal Sete" class="header-logo">
                <div class="border-l border-white/20 pl-3">
                    <p class="text-white font-bold text-sm leading-tight">Análise de Crédito</p>
                    <p class="text-blue-200 text-xs">Cristal Sete — Financeiro</p>
                </div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
                <span class="hidden sm:flex items-center gap-2"><span class="avatar" id="avatarInitial">?</span><span id="userName" class="text-white/80 text-sm font-medium"></span></span>
                <button onclick="sair()" class="btn-sair"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>Sair</button>
            </div>
        </div>
    </nav>
</header>

<main class="container mx-auto px-4 py-8">
    <!-- Cabeçalho do calendário -->
    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
        <div>
            <h1 class="text-2xl font-extrabold text-gray-800">Calendário de Reavaliações</h1>
            <p class="text-sm text-gray-500 mt-1">Visualize as reavaliações programadas por data</p>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="mesAnterior()" class="btn-secondary text-sm py-2 px-3">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <h2 class="text-lg font-bold text-gray-700 min-w-[200px] text-center" id="mesAno"></h2>
            <button onclick="proximoMes()" class="btn-secondary text-sm py-2 px-3">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
            </button>
            <button onclick="irParaHoje()" class="btn-primary text-sm py-2 px-4">Hoje</button>
        </div>
    </div>

    <!-- Legenda -->
    <div class="flex flex-wrap gap-4 mb-5 text-xs font-semibold">
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-red-200"></span> Vencido</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-yellow-200"></span> Próximo (7 dias)</span>
        <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-emerald-200"></span> Programado</span>
    </div>

    <!-- Calendário -->
    <div class="card p-4">
        <!-- Nomes dos dias -->
        <div class="cal-grid mb-2">
            <div class="cal-day-name">Dom</div>
            <div class="cal-day-name">Seg</div>
            <div class="cal-day-name">Ter</div>
            <div class="cal-day-name">Qua</div>
            <div class="cal-day-name">Qui</div>
            <div class="cal-day-name">Sex</div>
            <div class="cal-day-name">Sáb</div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
    </div>

    <!-- Lista do mês -->
    <div class="mt-8">
        <h3 class="text-base font-bold text-gray-700 mb-4" id="tituloListaMes"></h3>
        <div id="listaMes" class="space-y-2"></div>
        <div id="emptyMes" class="hidden text-center py-10">
            <p class="text-sm text-gray-400">Nenhuma reavaliação programada para este mês</p>
        </div>
    </div>
</main>

<!-- MODAL DIA -->
<div id="modalDia" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onclick="fecharModalDia()">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6" onclick="event.stopPropagation()" id="modalDiaConteudo"></div>
</div>

<footer class="mt-16 py-6 border-t border-gray-200 bg-white">
    <div class="container mx-auto px-4 text-center"><p class="text-xs text-gray-400">Análise de Crédito — Cristal Sete Vidros de Segurança</p></div>
</footer>

<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/sidebar.js"></script>
<script>
const REAV_KEY = 'ac_reavaliacoes_v1';
let mesAtual  = new Date().getMonth();
let anoAtual  = new Date().getFullYear();

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function getReavaliacoes() { try { return JSON.parse(localStorage.getItem(REAV_KEY) || '[]'); } catch { return []; } }

function getEventosPorData() {
    const reav   = getReavaliacoes().filter(r => r.status !== 'inativo');
    const hoje   = new Date(); hoje.setHours(0,0,0,0);
    const mapa   = {};
    reav.forEach(r => {
        const data  = r.dataAlerta;
        if (!mapa[data]) mapa[data] = [];
        const alerta = new Date(data); alerta.setHours(0,0,0,0);
        const diff   = Math.ceil((alerta - hoje) / (1000*60*60*24));
        const status = diff < 0 ? 'vencido' : diff <= 7 ? 'proximo' : 'ok';
        mapa[data].push({ ...r, status });
    });
    return mapa;
}

function renderCalendario() {
    const grid  = document.getElementById('calGrid');
    const titulo= document.getElementById('mesAno');
    titulo.textContent = `${MESES[mesAtual]} de ${anoAtual}`;

    const hoje     = new Date(); hoje.setHours(0,0,0,0);
    const eventos  = getEventosPorData();
    const primeiro = new Date(anoAtual, mesAtual, 1);
    const ultimo   = new Date(anoAtual, mesAtual + 1, 0);
    const iniciaDia= primeiro.getDay(); // 0=Dom
    const totalDias= ultimo.getDate();

    let html = '';

    // Dias do mês anterior
    for (let i = 0; i < iniciaDia; i++) {
        const d = new Date(anoAtual, mesAtual, -iniciaDia + i + 1);
        html += `<div class="cal-day outro-mes"><div class="cal-day-num">${d.getDate()}</div></div>`;
    }

    // Dias do mês
    for (let d = 1; d <= totalDias; d++) {
        const dataStr = `${anoAtual}-${String(mesAtual+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dataObj = new Date(anoAtual, mesAtual, d); dataObj.setHours(0,0,0,0);
        const isHoje  = dataObj.getTime() === hoje.getTime();
        const evs     = eventos[dataStr] || [];
        const temEv   = evs.length > 0;

        const numHtml = isHoje
            ? `<div class="cal-day-num"><span>${d}</span></div>`
            : `<div class="cal-day-num">${d}</div>`;

        const evHtml = evs.slice(0, 2).map(e =>
            `<div class="cal-evento ev-${e.status}" onclick="abrirModalDia('${dataStr}'); event.stopPropagation();" title="${e.nome}">
                ${e.nome.split(' ')[0]}
            </div>`
        ).join('') + (evs.length > 2 ? `<div class="ev-mais">+${evs.length-2} mais</div>` : '');

        html += `<div class="cal-day ${isHoje ? 'hoje' : ''} ${temEv ? 'tem-evento' : ''}" ${temEv ? `onclick="abrirModalDia('${dataStr}')"` : ''}>
            ${numHtml}
            ${evHtml}
        </div>`;
    }

    // Completar última linha
    const total = iniciaDia + totalDias;
    const resto = 7 - (total % 7 === 0 ? 7 : total % 7);
    for (let i = 1; i <= resto && resto < 7; i++) {
        html += `<div class="cal-day outro-mes"><div class="cal-day-num">${i}</div></div>`;
    }

    grid.innerHTML = html;
    renderListaMes();
}

function renderListaMes() {
    const eventos  = getEventosPorData();
    const lista    = document.getElementById('listaMes');
    const empty    = document.getElementById('emptyMes');
    const titulo   = document.getElementById('tituloListaMes');
    titulo.textContent = `Reavaliações em ${MESES[mesAtual]}`;

    const doMes = Object.entries(eventos)
        .filter(([data]) => {
            const d = new Date(data);
            return d.getMonth() === mesAtual && d.getFullYear() === anoAtual;
        })
        .sort(([a], [b]) => a.localeCompare(b));

    if (doMes.length === 0) { lista.innerHTML = ''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');

    const stConfig = {
        vencido: { cor:'bg-red-50 border-red-200',     dot:'bg-red-500',     txt:'text-red-700'     },
        proximo: { cor:'bg-amber-50 border-amber-200', dot:'bg-amber-400',   txt:'text-amber-700'   },
        ok:      { cor:'bg-white border-gray-200',     dot:'bg-emerald-500', txt:'text-emerald-700' },
    };

    lista.innerHTML = doMes.map(([data, evs]) =>
        evs.map(e => {
            const cfg = stConfig[e.status] || stConfig.ok;
            return `
            <div class="flex items-center gap-3 p-3 rounded-xl border ${cfg.cor}">
                <div class="w-2.5 h-2.5 rounded-full ${cfg.dot} shrink-0"></div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-semibold text-gray-800 truncate">${e.nome}</p>
                    <p class="text-xs font-mono text-gray-400">${formatCNPJ(e.cnpj)}</p>
                </div>
                <div class="text-right shrink-0">
                    <p class="text-xs font-bold ${cfg.txt}">${formatDate(data)}</p>
                    <p class="text-xs text-gray-400">A cada ${e.periodo} dias</p>
                </div>
                <a href="index.html?cnpj=${e.cnpj}" class="btn-secondary text-xs py-1.5 px-2.5 shrink-0 flex items-center gap-1">
                    <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35"/></svg>
                    Ver
                </a>
            </div>`;
        }).join('')
    ).join('');
}

function abrirModalDia(dataStr) {
    const eventos = getEventosPorData();
    const evs     = eventos[dataStr] || [];
    if (!evs.length) return;

    const stLabel = { vencido:'🔴 Vencido', proximo:'🟡 Próximo', ok:'🟢 Programado' };
    const el = document.getElementById('modalDiaConteudo');
    el.innerHTML = `
        <div class="flex items-center justify-between mb-4">
            <h3 class="font-bold text-gray-800">${formatDate(dataStr)}</h3>
            <button onclick="fecharModalDia()" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
        </div>
        <div class="space-y-3">
            ${evs.map(e => `
            <div class="bg-gray-50 border border-gray-100 rounded-xl p-3">
                <div class="flex items-start justify-between gap-2">
                    <div>
                        <p class="font-semibold text-sm text-gray-800">${e.nome}</p>
                        <p class="text-xs font-mono text-gray-400">${formatCNPJ(e.cnpj)}</p>
                        <p class="text-xs mt-1">${stLabel[e.status] || ''} · A cada ${e.periodo} dias</p>
                    </div>
                    <a href="index.html?cnpj=${e.cnpj}" class="btn-primary text-xs py-1.5 px-3 flex items-center gap-1 shrink-0">
                        <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35"/></svg>
                        Consultar
                    </a>
                </div>
            </div>`).join('')}
        </div>`;

    document.getElementById('modalDia').classList.remove('hidden');
}
function fecharModalDia() { document.getElementById('modalDia').classList.add('hidden'); }

function mesAnterior()  { if (mesAtual === 0) { mesAtual = 11; anoAtual--; } else mesAtual--; renderCalendario(); }
function proximoMes()   { if (mesAtual === 11) { mesAtual = 0; anoAtual++; } else mesAtual++; renderCalendario(); }
function irParaHoje()   { const h = new Date(); mesAtual = h.getMonth(); anoAtual = h.getFullYear(); renderCalendario(); }

window.addEventListener('DOMContentLoaded', renderCalendario);
</script>
</body>
</html>
