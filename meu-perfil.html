<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil — Análise de Crédito | Cristal Sete</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .page-header { background: linear-gradient(135deg, #1e3a5f 0%, #2B5FA6 100%); }
        .header-logo { height: 36px; width: auto; filter: brightness(0) invert(1); }
        .btn-sair { display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.75);font-size:0.8rem;font-weight:500;padding:0.4rem 0.875rem;border-radius:0.5rem;cursor:pointer;transition:all 0.2s; }
        .btn-sair:hover { background:rgba(255,255,255,0.15);color:white; }
        .avatar-hd { width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:0.75rem;overflow:hidden; }
        .avatar-hd img { width:100%;height:100%;object-fit:cover;border-radius:50%; }

        /* Avatar grande */
        .profile-avatar-wrap {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 8px 24px rgba(43,95,166,0.2);
            object-fit: cover;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            color: #2B5FA6;
            overflow: hidden;
        }
        .profile-avatar img { width:100%;height:100%;object-fit:cover;border-radius:50%; }
        .avatar-edit-btn {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2B5FA6;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .avatar-edit-btn:hover { background: #1e3a5f; transform: scale(1.1); }

        /* Perfil banner */
        .profile-banner {
            background: linear-gradient(135deg, #1e3a5f, #2B5FA6);
            border-radius: 1rem 1rem 0 0;
            height: 100px;
            position: relative;
        }
        .profile-card {
            background: white;
            border-radius: 1rem;
            border: 1.5px solid #e5e7eb;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(43,95,166,0.08);
        }

        /* Strength bar */
        .strength-bar { height: 4px; border-radius: 2px; background: #e5e7eb; margin-top: 4px; }
        .strength-fill { height: 100%; border-radius: 2px; transition: all 0.3s; }
        .strength-weak   { width: 33%; background: #ef4444; }
        .strength-medium { width: 66%; background: #f59e0b; }
        .strength-strong { width: 100%; background: #22c55e; }

        .perfil-badge { display:inline-flex;align-items:center;gap:4px;padding:3px 12px;border-radius:9999px;font-size:0.75rem;font-weight:700;text-transform:capitalize; }
        .badge-admin       { background:#fef3c7;color:#92400e; }
        .badge-analista    { background:#dbeafe;color:#1e40af; }
        .badge-coordenador { background:#d1fae5;color:#065f46; }
        .badge-gerente     { background:#ede9fe;color:#5b21b6; }

        .toast-success {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: #059669;
            color: white;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 0.75rem 1.25rem;
            border-radius: 0.75rem;
            box-shadow: 0 8px 24px rgba(5,150,105,0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 9999;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity:0; transform: translateY(20px); }
            to   { opacity:1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50">

<script>
    if (sessionStorage.getItem('ac_logado') !== 'true') window.location.href = 'login.html';
    const acUser = JSON.parse(sessionStorage.getItem('ac_usuario') || '{}');
</script>

<!-- HEADER -->
<header class="page-header sticky top-0 z-50">
    <nav class="container mx-auto px-4 py-3">
        <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 shrink-0">
                <button onclick="toggleSidebar()" class="sidebar-toggle-btn">
                    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <img src="assets/logos/cistalsete.png" alt="Cristal Sete" class="header-logo">
                <div class="border-l border-white/20 pl-3">
                    <p class="text-white font-bold text-sm leading-tight">Meu Perfil</p>
                    <p class="text-blue-200 text-xs">Análise de Crédito — Cristal Sete</p>
                </div>
            </div>
            <div class="flex items-center gap-3 shrink-0">
                <span class="hidden sm:flex items-center gap-2">
                    <span class="avatar-hd" id="avatarInitial">
                        <span id="avatarInitialText">?</span>
                    </span>
                    <span id="userName" class="text-white/80 text-sm font-medium"></span>
                </span>
                <button onclick="sair()" class="btn-sair">
                    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Sair
                </button>
            </div>
        </div>
    </nav>
</header>

<main class="container mx-auto px-4 py-8 max-w-3xl">

    <!-- CARD PERFIL -->
    <div class="profile-card mb-6">

        <!-- Banner -->
        <div class="profile-banner"></div>

        <!-- Avatar + Info -->
        <div class="px-6 pb-6">
            <!-- Avatar centralizado saindo do banner -->
            <div class="flex justify-center -mt-14 mb-4">
                <div class="profile-avatar-wrap">
                    <div class="profile-avatar" id="profileAvatarEl">
                        <span id="profileInitials"></span>
                    </div>
                    <div class="avatar-edit-btn" onclick="document.getElementById('avatarFileInput').click()" title="Trocar foto">
                        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                            <circle cx="12" cy="13" r="3"/>
                        </svg>
                    </div>
                    <input type="file" id="avatarFileInput" accept="image/*" class="hidden" onchange="handleAvatarUpload(this)">
                </div>
            </div>

            <!-- Nome, cargo e perfil centralizados -->
            <div class="text-center mb-4">
                <h2 class="text-xl font-extrabold text-gray-800" id="profileNome">—</h2>
                <p class="text-sm text-gray-400 mt-0.5" id="profileCargo">—</p>
                <span class="perfil-badge mt-2 inline-flex" id="profileBadge"></span>
                <div class="mt-3">
                    <button onclick="removerFoto()" id="btnRemoverFoto" class="hidden text-xs text-red-400 hover:text-red-600 transition-colors inline-flex items-center gap-1.5">
                        <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        Remover foto
                    </button>
                </div>
            </div>

            <p class="text-xs text-blue-600 bg-blue-50 border border-blue-100 rounded-lg px-3 py-2 inline-flex items-center gap-1.5">
                <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><circle cx="12" cy="13" r="3"/></svg>
                Clique no ícone da câmera para trocar sua foto
            </p>
        </div>
    </div>

    <!-- FORMULÁRIO DE DADOS -->
    <div class="grid sm:grid-cols-2 gap-6">

        <!-- Dados Pessoais -->
        <div class="card sm:col-span-2">
            <h3 class="text-base font-bold text-gray-800 mb-4 flex items-center gap-2">
                <span class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="#2B5FA6" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </span>
                Dados Pessoais
            </h3>
            <div class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label>Nome Completo</label>
                    <input type="text" id="pf_nome" placeholder="Seu nome completo" readonly class="bg-gray-50 cursor-not-allowed">
                    <p class="text-xs text-gray-400 mt-1">Alteração somente pelo administrador</p>
                </div>
                <div>
                    <label>Cargo</label>
                    <input type="text" id="pf_cargo" placeholder="Ex: Analista Financeiro">
                </div>
                <div>
                    <label>E-mail</label>
                    <input type="email" id="pf_email" placeholder="seu@cristalsete.com.br" readonly class="bg-gray-50 cursor-not-allowed">
                    <p class="text-xs text-gray-400 mt-1">Alteração somente pelo administrador</p>
                </div>
                <div>
                    <label>Telefone</label>
                    <input type="text" id="pf_telefone" placeholder="(XX) XXXXX-XXXX">
                </div>
            </div>
            <button onclick="salvarDados()" class="btn-primary text-sm mt-5 flex items-center gap-2">
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                Salvar Dados
            </button>
        </div>

        <!-- Alterar Senha -->
        <div class="card sm:col-span-2">
            <h3 class="text-base font-bold text-gray-800 mb-4 flex items-center gap-2">
                <span class="w-8 h-8 rounded-lg bg-amber-50 flex items-center justify-center">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="#b45309" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </span>
                Alterar Senha
            </h3>
            <div class="grid sm:grid-cols-3 gap-4">
                <div>
                    <label>Senha Atual <span class="text-red-400 text-xs">*</span></label>
                    <div class="relative">
                        <input type="password" id="pf_senha_atual" placeholder="Senha atual">
                        <button type="button" onclick="toggleVis('pf_senha_atual')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </button>
                    </div>
                </div>
                <div>
                    <label>Nova Senha <span class="text-red-400 text-xs">*</span></label>
                    <div class="relative">
                        <input type="password" id="pf_senha_nova" placeholder="Mínimo 8 caracteres" oninput="checkStrength()">
                        <button type="button" onclick="toggleVis('pf_senha_nova')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </button>
                    </div>
                    <div class="strength-bar"><div id="strengthFill" class="strength-fill"></div></div>
                    <p id="strengthText" class="text-xs text-gray-400 mt-1"></p>
                </div>
                <div>
                    <label>Confirmar Nova Senha</label>
                    <div class="relative">
                        <input type="password" id="pf_senha_conf" placeholder="Repita a nova senha">
                        <button type="button" onclick="toggleVis('pf_senha_conf')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                        </button>
                    </div>
                </div>
            </div>
            <div id="senhaError" class="hidden mt-3"><div class="alert alert-danger text-sm" id="senhaErrorMsg"></div></div>
            <button onclick="alterarSenha()" class="btn-primary text-sm mt-5 flex items-center gap-2" style="background:#b45309">
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                Alterar Senha
            </button>
        </div>

    </div>

</main>

<footer class="mt-16 py-6 border-t border-gray-200 bg-white">
    <div class="container mx-auto px-4 text-center">
        <p class="text-xs text-gray-400">Análise de Crédito — Cristal Sete Vidros de Segurança</p>
    </div>
</footer>

<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/sidebar.js"></script>
<script>
const USERS_KEY = 'ac_usuarios_v1';
const PERFIL_CFG = {
    admin:       { label:'Administrador', badge:'badge-admin'       },
    analista:    { label:'Analista',      badge:'badge-analista'    },
    coordenador: { label:'Coordenador',   badge:'badge-coordenador' },
    gerente:     { label:'Gerente',       badge:'badge-gerente'     },
};

function getUsuarios() {
    try { return JSON.parse(localStorage.getItem(USERS_KEY) || '[]'); } catch { return []; }
}
function saveUsuarios(d) { localStorage.setItem(USERS_KEY, JSON.stringify(d)); }

function getUserAtual() {
    const users = getUsuarios();
    return users.find(u => u.email === acUser.usuario) || null;
}

// ── INICIALIZAÇÃO ──
window.addEventListener('DOMContentLoaded', () => {
    carregarPerfil();
});

function carregarPerfil() {
    const user = getUserAtual();
    if (!user) return;

    const iniciais = user.nome.split(' ').slice(0,2).map(n=>n[0]).join('').toUpperCase();
    const cfg      = PERFIL_CFG[user.perfil] || PERFIL_CFG.analista;

    // Avatar
    const avatarEl = document.getElementById('profileAvatarEl');
    if (user.avatar) {
        avatarEl.innerHTML = `<img src="${user.avatar}" alt="${user.nome}">`;
        document.getElementById('btnRemoverFoto').classList.remove('hidden');
    } else {
        document.getElementById('profileInitials').textContent = iniciais;
    }

    // Header avatar
    const headerAvatar = document.getElementById('avatarInitial');
    if (headerAvatar) {
        if (user.avatar) {
            headerAvatar.innerHTML = `<img src="${user.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
        } else {
            headerAvatar.querySelector('#avatarInitialText').textContent = iniciais;
        }
    }

    // Info
    document.getElementById('profileNome').textContent  = user.nome;
    document.getElementById('profileCargo').textContent = user.cargo || 'Sem cargo definido';
    const badge = document.getElementById('profileBadge');
    badge.className    = `perfil-badge ${cfg.badge}`;
    badge.textContent  = cfg.label;

    // Formulário
    document.getElementById('pf_nome').value     = user.nome;
    document.getElementById('pf_cargo').value    = user.cargo || '';
    document.getElementById('pf_email').value    = user.email;
    document.getElementById('pf_telefone').value = user.telefone || '';
}

// ── FOTO ──
function handleAvatarUpload(input) {
    const file = input.files[0];
    if (!file) return;

    // Validar tamanho (max 2MB)
    if (file.size > 2 * 1024 * 1024) {
        alert('A foto deve ter no máximo 2MB.');
        return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
        const base64 = e.target.result;

        // Atualizar avatar na tela
        const avatarEl = document.getElementById('profileAvatarEl');
        avatarEl.innerHTML = `<img src="${base64}" alt="Foto de perfil">`;
        document.getElementById('btnRemoverFoto').classList.remove('hidden');

        // Salvar no storage
        salvarAvatar(base64);
        mostrarToast('✅ Foto atualizada com sucesso!');
    };
    reader.readAsDataURL(file);
}

function removerFoto() {
    if (!confirm('Remover sua foto de perfil?')) return;
    const user = getUserAtual();
    if (!user) return;

    const iniciais = user.nome.split(' ').slice(0,2).map(n=>n[0]).join('').toUpperCase();
    document.getElementById('profileAvatarEl').innerHTML = `<span id="profileInitials">${iniciais}</span>`;
    document.getElementById('btnRemoverFoto').classList.add('hidden');

    salvarAvatar('');
    mostrarToast('✅ Foto removida!');
}

function salvarAvatar(base64) {
    const users = getUsuarios();
    const idx   = users.findIndex(u => u.email === acUser.usuario);
    if (idx === -1) return;

    users[idx].avatar = base64;
    saveUsuarios(users);
    sincronizarSessao(users[idx]);
    sincronizarLogin(users);
}

// ── DADOS ──
function salvarDados() {
    const cargo    = document.getElementById('pf_cargo').value.trim();
    const telefone = document.getElementById('pf_telefone').value.trim();

    const users = getUsuarios();
    const idx   = users.findIndex(u => u.email === acUser.usuario);
    if (idx === -1) return;

    users[idx].cargo    = cargo;
    users[idx].telefone = telefone;
    saveUsuarios(users);
    sincronizarSessao(users[idx]);
    sincronizarLogin(users);

    // Atualizar cargo exibido
    document.getElementById('profileCargo').textContent = cargo || 'Sem cargo definido';
    mostrarToast('✅ Dados salvos com sucesso!');
}

// ── SENHA ──
function alterarSenha() {
    const atual = document.getElementById('pf_senha_atual').value;
    const nova  = document.getElementById('pf_senha_nova').value;
    const conf  = document.getElementById('pf_senha_conf').value;

    document.getElementById('senhaError').classList.add('hidden');

    if (!atual) { showSenhaError('Informe sua senha atual.'); return; }
    if (!nova)  { showSenhaError('Informe a nova senha.'); return; }
    if (nova.length < 8) { showSenhaError('A nova senha deve ter no mínimo 8 caracteres.'); return; }
    if (nova !== conf)   { showSenhaError('As senhas não coincidem.'); return; }

    const users = getUsuarios();
    const idx   = users.findIndex(u => u.email === acUser.usuario);
    if (idx === -1) return;

    if (users[idx].senha !== atual) {
        showSenhaError('Senha atual incorreta.');
        return;
    }

    users[idx].senha = nova;
    saveUsuarios(users);
    sincronizarLogin(users);

    // Limpar campos
    document.getElementById('pf_senha_atual').value = '';
    document.getElementById('pf_senha_nova').value  = '';
    document.getElementById('pf_senha_conf').value  = '';
    document.getElementById('strengthFill').className = 'strength-fill';
    document.getElementById('strengthText').textContent = '';

    mostrarToast('✅ Senha alterada com sucesso!');
}

function showSenhaError(msg) {
    document.getElementById('senhaError').classList.remove('hidden');
    document.getElementById('senhaErrorMsg').textContent = msg;
}

function checkStrength() {
    const senha = document.getElementById('pf_senha_nova').value;
    const fill  = document.getElementById('strengthFill');
    const text  = document.getElementById('strengthText');
    if (!senha) { fill.className = 'strength-fill'; text.textContent = ''; return; }
    const forte = senha.length >= 8 && /[A-Z]/.test(senha) && /[0-9]/.test(senha) && /[^A-Za-z0-9]/.test(senha);
    const media = senha.length >= 8 && (/[A-Z]/.test(senha) || /[0-9]/.test(senha));
    if (forte)      { fill.className = 'strength-fill strength-strong'; text.textContent = '✅ Senha forte';  text.style.color = '#059669'; }
    else if (media) { fill.className = 'strength-fill strength-medium'; text.textContent = '⚠️ Senha média'; text.style.color = '#d97706'; }
    else            { fill.className = 'strength-fill strength-weak';   text.textContent = '❌ Senha fraca';  text.style.color = '#dc2626'; }
}

function toggleVis(id) {
    const input = document.getElementById(id);
    input.type  = input.type === 'password' ? 'text' : 'password';
}

// ── SINCRONIZAÇÃO ──
function sincronizarSessao(user) {
    // Atualiza sessão atual
    const sessao = JSON.parse(sessionStorage.getItem('ac_usuario') || '{}');
    sessao.avatar = user.avatar || '';
    sessao.nome   = user.nome;
    sessionStorage.setItem('ac_usuario', JSON.stringify(sessao));
}

function sincronizarLogin(users) {
    localStorage.setItem('ac_usuarios_login', JSON.stringify(
        users.filter(u => u.status !== 'inativo').map(u => ({
            usuario: u.email,
            senha:   u.senha,
            nome:    u.nome,
            perfil:  u.perfil,
            avatar:  u.avatar || ''
        }))
    ));
}

// ── TOAST ──
function mostrarToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast-success';
    toast.innerHTML = `<svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> ${msg}`;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}
</script>
