<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprovações — Análise de Crédito | Cristal Sete</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .page-header { background: linear-gradient(135deg, #1e3a5f 0%, #2B5FA6 100%); border-bottom: 1px solid rgba(255,255,255,0.08); }
        .header-logo { height: 36px; width: auto; filter: brightness(0) invert(1); }
        .nav-link { display:flex;align-items:center;gap:6px;color:rgba(255,255,255,0.65);font-weight:500;font-size:0.875rem;padding:0.5rem 0.875rem;border-radius:0.5rem;transition:all 0.2s;text-decoration:none;border:none;background:none; }
        .nav-link:hover { color:white;background:rgba(255,255,255,0.1); }
        .nav-link.active { color:white;background:rgba(255,255,255,0.15);font-weight:600; }
        .btn-sair { display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.75);font-size:0.8rem;font-weight:500;padding:0.4rem 0.875rem;border-radius:0.5rem;cursor:pointer;transition:all 0.2s; }
        .btn-sair:hover { background:rgba(255,255,255,0.15);color:white; }
        .avatar { width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:0.75rem; }
        .notif-badge { background:#ef4444;color:white;font-size:0.65rem;font-weight:800;padding:1px 6px;border-radius:9999px;min-width:18px;text-align:center; }
        .sol-card { background:white;border:1.5px solid #e5e7eb;border-radius:0.75rem;padding:1.25rem;transition:all 0.2s;cursor:pointer; }
        .sol-card:hover { border-color:#93c5fd;box-shadow:0 4px 12px rgba(43,95,166,0.1); }
        .tab-btn-filt { padding:0.4rem 1rem;border-radius:0.5rem;font-size:0.8rem;font-weight:600;cursor:pointer;border:1.5px solid #e5e7eb;background:white;color:#6b7280;transition:all 0.2s; }
        .tab-btn-filt:hover { border-color:#2B5FA6;color:#2B5FA6; }
        .tab-btn-filt.active { background:#2B5FA6;color:white;border-color:#2B5FA6; }
        .timeline-item { position:relative;padding-left:2rem;padding-bottom:1.25rem; }
        .timeline-item:not(:last-child)::before { content:'';position:absolute;left:0.45rem;top:1.5rem;bottom:0;width:2px;background:#e5e7eb; }
        .timeline-dot { position:absolute;left:0;top:0.25rem;width:0.875rem;height:0.875rem;border-radius:50%;border:2px solid white;box-shadow:0 0 0 2px #e5e7eb; }

        /* Situação Serasa select customizado */
        select option[value="regular"]        { color: #065f46; font-weight: 600; }
        select option[value="pendencias"]     { color: #92400e; font-weight: 600; }
        select option[value="restrita"]       { color: #991b1b; font-weight: 600; }
        select option[value="nao_consultado"] { color: #6b7280; font-weight: 600; }

        .serasa-select-wrap { position: relative; }
        .serasa-select-wrap::before {
            content: '';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }
        .serasa-select-wrap.regular::before    { background: #10b981; }
        .serasa-select-wrap.pendencias::before { background: #f59e0b; }
        .serasa-select-wrap.restrita::before   { background: #ef4444; }
        .serasa-select-wrap.nao_consultado::before { background: #9ca3af; }
        .serasa-select-wrap select { padding-left: 28px !important; }
    </style>
</head>
<body class="bg-gray-50">

<script>
    if (sessionStorage.getItem('ac_logado') !== 'true') window.location.href = 'login.html';
    const acUser = JSON.parse(sessionStorage.getItem('ac_usuario') || '{}');
</script>

<!-- HEADER -->
<header class="page-header sticky top-0 z-50">
    <nav class="container mx-auto px-4 py-3">
        <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 shrink-0">
                <button onclick="toggleSidebar()" class="sidebar-toggle-btn" title="Menu">
                    <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <img src="assets/logos/cistalsete.png" alt="Cristal Sete" class="header-logo">
                <div class="border-l border-white/20 pl-3">
                    <p class="text-white font-bold text-sm leading-tight">Análise de Crédito</p>
                    <p class="text-blue-200 text-xs">Cristal Sete — Financeiro</p>
                </div>
            </div>
            <div class="hidden md:flex items-center gap-1">
                <a href="index.html" class="nav-link">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35"/></svg>
                    Consulta CNPJ
                </a>
                <a href="historico.html" class="nav-link">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    Histórico
                </a>
                <a href="aprovacoes.html" class="nav-link active">
                    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    Aprovações
                    <span id="headerBadge" class="notif-badge hidden">0</span>
                </a>
            </div>
            <div class="flex items-center gap-3 shrink-0">
                <span class="hidden sm:flex items-center gap-2">
                    <span class="avatar" id="avatarInitial">?</span>
                    <span id="userName" class="text-white/80 text-sm font-medium"></span>
                </span>
                <button onclick="sair()" class="btn-sair">
                    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    Sair
                </button>
            </div>
        </div>
    </nav>
</header>

<main class="container mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
        <div>
            <h1 class="text-2xl font-extrabold text-gray-800">Aprovações de Crédito</h1>
            <p class="text-sm text-gray-500 mt-1" id="subtituloPage"></p>
        </div>
        <button onclick="abrirModalNova()" id="btnNovaSolic" class="btn-primary text-sm py-2.5 px-5 flex items-center gap-2">
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            Nova Solicitação
        </button>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6" id="statsGrid"></div>
    <div class="flex flex-wrap gap-2 mb-5" id="filtrosWrap"></div>
    <div id="listaSolicacoes" class="space-y-3"></div>
    <div id="emptyState" class="hidden text-center py-20">
        <div class="w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="#2B5FA6" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
        <h3 class="text-lg font-bold text-gray-500">Nenhuma solicitação encontrada</h3>
        <p class="text-sm text-gray-400 mt-1" id="emptyMsg"></p>
    </div>
</main>

<!-- ══ MODAL NOVA SOLICITAÇÃO ══ -->
<div id="modalNova" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto" onclick="fecharModalNova()">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6 my-4" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between mb-5">
            <h3 class="text-lg font-bold text-gray-800">Nova Solicitação de Crédito</h3>
            <button onclick="fecharModalNova()" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
        </div>
        <div class="space-y-4">
            <div class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label>CNPJ do Cliente <span class="text-red-400 text-xs">*</span></label>
                    <input type="text" id="nov_cnpj" placeholder="00.000.000/0000-00" maxlength="18" oninput="maskCNPJModal(this)" onblur="buscarNomeEmpresa()">
                </div>
                <div>
                    <label>Razão Social <span class="text-red-400 text-xs">*</span></label>
                    <input type="text" id="nov_nome" placeholder="Buscando automaticamente...">
                </div>
            </div>
            <div>
                <label>Resumo da Reunião <span class="text-red-400 text-xs">*</span></label>
                <textarea id="nov_reuniao" rows="3" placeholder="Descreva os principais pontos da reunião com o cliente..."></textarea>
            </div>
            <div>
                <label>Perfil do Cliente</label>
                <textarea id="nov_perfil" rows="2" placeholder="Ramo de atividade, tempo de mercado, porte, histórico..."></textarea>
            </div>
            <div class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label>Consumo / Volume Estimado</label>
                    <input type="text" id="nov_consumo" placeholder="Ex: 500m² por mês">
                </div>
                <div>
                    <label>Limite de Crédito Sugerido <span class="text-red-400 text-xs">*</span></label>
                    <input type="text" id="nov_limite" placeholder="Ex: R$ 50.000,00">
                </div>
            </div>
            <div class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label>Condições de Pagamento Sugeridas</label>
                    <input type="text" id="nov_condicoes" placeholder="Ex: 30/60/90 dias, boleto">
                </div>
                <div>
                    <label>Situação Serasa</label>
                    <div class="serasa-select-wrap" id="nov_serasa_wrap"><select id="nov_serasa" onchange="updateSerasaWrap(this)">
                        <option value="">Selecione...</option>
                        <option value="regular">Regular</option>
                        <option value="pendencias">Com Pendências</option>
                        <option value="restrita">Restrita</option>
                        <option value="nao_consultado">Não Consultado</option>
                    </select>
                </div>
            </div>
            <div>
                <label>Observações Adicionais</label>
                <textarea id="nov_obs" rows="2" placeholder="Informações relevantes não cobertas acima..."></textarea>
            </div>
            <div id="novError" class="hidden alert alert-danger text-sm"></div>
        </div>
        <div class="flex gap-3 mt-6">
            <button onclick="salvarSolicitacao()" class="btn-primary flex-1 flex items-center justify-center gap-2">
                <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                Enviar para Aprovação
            </button>
            <button onclick="fecharModalNova()" class="btn-secondary">Cancelar</button>
        </div>
    </div>
</div>

<!-- ══ MODAL DETALHE ══ -->
<div id="modalDetalhe" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto" onclick="fecharModalDetalhe()">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6 my-4" onclick="event.stopPropagation()" id="modalDetalheConteudo"></div>
</div>

<!-- ══ MODAL SUCESSO ══ -->
<div id="modalSucesso" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="#059669" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        </div>
        <h3 class="text-lg font-bold text-gray-800 mb-2" id="sucessoTitulo">Enviado!</h3>
        <p class="text-sm text-gray-500 mb-5" id="sucessoMsg"></p>
        <button onclick="document.getElementById('modalSucesso').classList.add('hidden')" class="btn-primary w-full">OK</button>
    </div>
</div>

<footer class="mt-16 py-6 border-t border-gray-200 bg-white">
    <div class="container mx-auto px-4 text-center">
        <p class="text-xs text-gray-400">Análise de Crédito — Cristal Sete Vidros de Segurança</p>
    </div>
</footer>

<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/emailjs-config.js"></script>
<script src="js/aprovacoes.js"></script>
<script src="js/sidebar.js"></script>
</body>
</html>
